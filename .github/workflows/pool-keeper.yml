name: Pool keeper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: zamops-pool-sepolia-keeper
  cancel-in-progress: false

jobs:
  advance-pools:
    runs-on: ubuntu-latest
    environment: Zamops-pool
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts
    env:
      KEEPER_ENABLED: ${{ vars.KEEPER_ENABLED }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || vars.SEPOLIA_RPC_URL }}
      KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
      KEEPER_PRIZE_CONFIG_JSON: ${{ vars.KEEPER_PRIZE_CONFIG_JSON }}
      KEEPER_FUNDING_ENABLED: ${{ vars.KEEPER_FUNDING_ENABLED || 'true' }}
      KEEPER_MIN_BALANCE_ETH: ${{ vars.KEEPER_MIN_BALANCE_ETH || '0.02' }}
      KEEPER_STALL_THRESHOLD_MINUTES: ${{ vars.KEEPER_STALL_THRESHOLD_MINUTES || '20' }}
      KEEPER_RPC_MAX_BLOCK_AGE_SECONDS: ${{ vars.KEEPER_RPC_MAX_BLOCK_AGE_SECONDS || '180' }}
      KEEPER_GOLDSKY_URL: ${{ vars.NEXT_PUBLIC_ZAMOPS_POOL_SUBGRAPH_URL }}
      KEEPER_FAUCET_SPONSOR_ADDRESS: ${{ vars.KEEPER_FAUCET_SPONSOR_ADDRESS || '0xd04BBA49865f57840D4F03CCf541961906843AF1' }}
      KEEPER_FAUCET_SPONSOR_MIN_BALANCE_ETH: ${{ vars.KEEPER_FAUCET_SPONSOR_MIN_BALANCE_ETH || '0.02' }}
      KEEPER_REPORT_PATH: reports/pool-keeper.json
    steps:
      - name: Read keeper control
        id: keeper-control
        working-directory: .
        shell: bash
        run: |
          case "${KEEPER_ENABLED,,}" in
            false|0|off|no)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "## Sepolia pool keeper" >> "$GITHUB_STEP_SUMMARY"
              echo "Paused by KEEPER_ENABLED=${KEEPER_ENABLED}. No transactions were submitted." >> "$GITHUB_STEP_SUMMARY"
              ;;
            ""|true|1|on|yes)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::KEEPER_ENABLED must be true/false, on/off, yes/no or 1/0. Received: ${KEEPER_ENABLED}"
              exit 1
              ;;
          esac
      - if: steps.keeper-control.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Validate keeper configuration
        if: steps.keeper-control.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -z "$SEPOLIA_RPC_URL" ]]; then
            echo "::error::SEPOLIA_RPC_URL is empty. Add it as a repository secret or Actions variable."
            exit 1
          fi
          if [[ -z "$KEEPER_PRIVATE_KEY" ]]; then
            echo "::error::KEEPER_PRIVATE_KEY is empty. Add it as a repository secret."
            exit 1
          fi
      - if: steps.keeper-control.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - if: steps.keeper-control.outputs.enabled == 'true'
        run: npm ci
      - if: steps.keeper-control.outputs.enabled == 'true'
        run: npm run keeper:sepolia
      - name: Upload keeper report
        if: always() && steps.keeper-control.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pool-keeper-${{ github.run_id }}
          path: contracts/reports/pool-keeper.json
          if-no-files-found: warn
          retention-days: 30
